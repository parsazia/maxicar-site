<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123d70">
  <title>اتصال اینترنت برقرار نیست | ماکسیکار</title>
  <style>
    :root{color-scheme:light;font-family:Tahoma,Arial,sans-serif;background:#f5f6f7;color:#172536}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px);background:#fff;border:1px solid #e0e5ea;border-radius:22px;padding:32px 24px;text-align:center;box-shadow:0 18px 60px #123d7010}
    .mark{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 20px;border-radius:18px;background:#123d70;color:#fff;font-size:32px;font-weight:700}
    h1{font-size:22px;margin:0 0 12px}
    p{line-height:2;color:#586778;margin:0 0 24px}
    button{border:0;border-radius:12px;background:#123d70;color:#fff;padding:13px 20px;font:inherit;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">M</div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای دیدن قیمت، موجودی و مشخصات به‌روز قطعات، اتصال اینترنت لازم است. پس از وصل‌شدن اینترنت دوباره تلاش کن.</p>
    <button onclick="window.location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
